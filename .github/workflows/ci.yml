# Mirrors the local quality pipeline exactly (spec 0013 / INV-0014-05).
# Required status check for merging into develop (spec 0014 branch protection).
#
# Phased activation (see T-0014-01 backlog note):
#   - T-0013-01: uv sync + pytest only; quality-tool steps are wired but
#     continue-on-error until T-0013-02 installs and configures the toolchain.
#   - T-0013-02: add ruff/pyright/bandit/import-linter/pytest-cov to dev group,
#     add their configs, then remove continue-on-error from those steps.
#   - T-0000-01: add scripts/check_specs.py and scripts/check_language.py, then
#     remove continue-on-error from the spec & language checks step.
#   - T-0014-02: enable the required `ci` status check on develop.
name: ci

on:
  pull_request:
    branches: [develop]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Format
        continue-on-error: true  # remove after T-0013-02 adds ruff to dev group
        run: uv run ruff format --check .
      - name: Lint
        continue-on-error: true  # remove after T-0013-02 adds ruff to dev group
        run: uv run ruff check .
      - name: Types
        continue-on-error: true  # remove after T-0013-02 adds pyright to dev group
        run: uv run pyright
      - name: Security
        continue-on-error: true  # remove after T-0013-02 adds bandit to dev group
        run: uv run bandit -r packages agents mcp_servers -ll
      - name: Import contracts
        continue-on-error: true  # remove after T-0013-02 adds import-linter + .importlinter
        run: uv run lint-imports
      - name: Tests + coverage
        # --cov flags require pytest-cov (added in T-0013-02); plain pytest suffices for T-0013-01
        run: uv run pytest -m "not live_ollama"
      - name: Spec & language checks
        continue-on-error: true  # remove after T-0000-01 creates scripts/check_specs.py
        run: |
          uv run python scripts/check_specs.py
          uv run python scripts/check_language.py
