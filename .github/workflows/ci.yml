# Mirrors the local quality pipeline exactly (spec 0013 / INV-0014-05).
# Required status check for merging into develop (spec 0014 branch protection).
name: ci

on:
  pull_request:
    branches: [develop]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run pyright
      - name: Security
        run: uv run bandit -r packages agents mcp_servers -ll
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests + coverage
        run: uv run pytest -m "not live_ollama" --cov --cov-fail-under=80
      - name: Spec & language checks
        run: |
          uv run python scripts/check_specs.py
          uv run python scripts/check_language.py
